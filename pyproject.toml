[project]
name = "castros-ia-galicia"
version = "0.1.0"
description = "MVP reproducible para preparar capas QGIS de castros de Trasancos y futura deteccion geoespacial."
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
raster = [
    "geopandas",
    "numpy",
    "pillow",
    "pyproj",
    "rasterio",
    "shapely",
]
lidar = [
    "laspy[lazrs]",
]
ml = [
    "scikit-learn",
    "torch",
    "ultralytics",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
