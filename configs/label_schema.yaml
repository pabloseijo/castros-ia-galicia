version: 2026-07-31

positive_label_classes:
  - castro
  - croa
  - recinto
  - muralla
  - foso
  - uncertain

positive_geometry_types:
  - manual_polygon
  - adjusted_buffer
  - visible_boundary
  - approximate_boundary

negative_types:
  - agricultural
  - forestry
  - road_cut
  - quarry
  - natural_hill
  - urban
  - unclear

confidence_values:
  - high
  - medium
  - low

review_status_values:
  - pending
  - accepted
  - needs_followup
  - rejected

final_splits:
  - train
  - val
  - test
  - test_o_val
  - exclude

rules:
  - Buffers generated by scripts are not final labels.
  - Only features marked accepted in annotation layers can be exported for training.
  - O Val stays in test_o_val and must not be used for train in v0.
  - Generated negatives must be visually reviewed before use.
  - Candidate or unverified coordinates must not be published as discoveries.
